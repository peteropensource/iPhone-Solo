name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads and checks. It cannot push, tag, comment, merge, or
# touch releases, because the token it is handed can do none of those things.
permissions:
  contents: read

jobs:
  test:
    name: Test on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run the specification conformance tests
        run: swift test

  build:
    name: Build for ${{ matrix.platform }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme TiltFold -destination 'generic/platform=${{ matrix.platform }}' build

  examples:
    name: Build ${{ matrix.example }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        example: [iPhoneSolo, LiveContent]
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild \
            -project Examples/${{ matrix.example }}/${{ matrix.example }}.xcodeproj \
            -scheme ${{ matrix.example }} \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-math:
    name: Verify the Android maths against the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install kotlinc
        run: |
          curl -sSLO https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q kotlin-compiler-1.9.22.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"
      # The Android module itself cannot be built here; this checks the layer that can.
      - run: ./Android/verify-math.sh
