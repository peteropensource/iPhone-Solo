name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads and checks. It cannot push, tag, comment, merge, or
# touch releases, because the token it is handed can do none of those things.
permissions:
  contents: read

jobs:
  test:
    name: Test on iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Run the suite on the platform the package actually targets, rather than on the host.
      - name: Run the specification conformance tests
        run: |
          xcodebuild test \
            -scheme TiltFold \
            -destination 'platform=iOS Simulator,name=iPhone 16'

  build:
    name: Build for iOS devices
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The simulator build above is x86/arm64 host code; this is the real device slice.
      - run: xcodebuild -scheme TiltFold -destination 'generic/platform=iOS' build

  examples:
    name: Build ${{ matrix.example }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        example: [iPhoneSolo, LiveContent]
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild \
            -project Examples/${{ matrix.example }}/${{ matrix.example }}.xcodeproj \
            -scheme ${{ matrix.example }} \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-math:
    name: Verify the Android maths against the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install kotlinc
        run: |
          curl -sSLO https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q kotlin-compiler-1.9.22.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"
      # Checks the arithmetic with no Android SDK at all, which is the point of it existing.
      - run: ./Android/verify-math.sh

  android:
    name: Build and test the Android module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'      # AGP 8.2 will not run on anything newer
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :tiltfold:testDebugUnitTest :tiltfold:assembleDebug :sample:assembleDebug
        working-directory: Android
